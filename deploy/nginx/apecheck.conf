# ApeCheck — Nginx (HANDOFF §12)
# apecheck.io → web (Next.js, :3000) · api.apecheck.io → API (Fastify, :4000) · mcp.apecheck.io → API /mcp · www → apex
#
# Install:
#   sudo cp deploy/nginx/apecheck.conf /etc/nginx/sites-available/apecheck.conf
#   sudo ln -s /etc/nginx/sites-available/apecheck.conf /etc/nginx/sites-enabled/apecheck.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d apecheck.io -d www.apecheck.io -d api.apecheck.io -d mcp.apecheck.io
# certbot adds the 443 listeners, certificates and http→https redirects to these server blocks.

upstream apecheck_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream apecheck_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.apecheck.io;
    return 301 https://apecheck.io$request_uri;
}

# Website
server {
    listen 80;
    listen [::]:80;
    server_name apecheck.io;

    client_max_body_size 1m;
    server_tokens off;

    # Same values as next.config.mjs sends: two different X-Frame-Options values cancel each other out in browsers.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://apecheck_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://apecheck_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# API
server {
    listen 80;
    listen [::]:80;
    server_name api.apecheck.io;

    client_max_body_size 256k;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # Live check log (SSE): no buffering, no gzip, long-lived connections.
    location ~ ^/v1/checks/[^/]+/events$ {
        proxy_pass http://apecheck_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # MCP server (M4) at api.apecheck.io/mcp too: same SSE-safe settings as mcp.apecheck.io below.
    location = /mcp {
        proxy_pass http://apecheck_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Agent screenshots (served by the API from SCREENSHOT_DIR). The API rate-limits /shots per client IP,
    # so forward it like every other location (without it all visitors would share one limit).
    location /shots/ {
        proxy_pass http://apecheck_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
    }

    location / {
        proxy_pass http://apecheck_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# MCP server (M4): mcp.apecheck.io → the API's /mcp (Streamable HTTP, stateless). Clients are configured with
# https://mcp.apecheck.io (the /api page) or https://mcp.apecheck.io/mcp; both reach /mcp. A tool call's answer is an
# SSE stream (run_check waits up to 150 s, with a keep-alive comment every 15 s): no buffering, no gzip, long reads.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.apecheck.io;

    client_max_body_size 64k;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        proxy_pass http://apecheck_api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /mcp {
        proxy_pass http://apecheck_api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}

