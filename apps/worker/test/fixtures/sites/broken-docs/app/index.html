<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lumen app</title><style>body{font-family:sans-serif;margin:0}header,main,footer{padding:24px}nav a{margin-right:16px}.btn{display:inline-block;padding:12px 20px;background:#222;color:#fff;border-radius:8px;text-decoration:none;border:0;font-size:16px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}.modal.open{display:flex}.modal .box{background:#fff;padding:32px;border-radius:12px}footer{margin-top:900px;border-top:1px solid #ddd}</style></head>
<body><header><button class="btn" id="connect">Connect wallet</button></header>
<main><h2>Markets</h2><p id="who"></p></main>
<script>document.getElementById('connect').addEventListener('click', async () => { const a = await window.ethereum.request({ method: 'eth_requestAccounts' }); document.getElementById('who').textContent = 'Connected ' + a[0]; });</script>
</body></html>
