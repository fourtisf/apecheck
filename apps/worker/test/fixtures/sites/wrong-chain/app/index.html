<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Polyswap app</title><style>body{font-family:sans-serif;margin:0}header,main,footer{padding:24px}nav a{margin-right:16px}.btn{display:inline-block;padding:12px 20px;background:#222;color:#fff;border-radius:8px;text-decoration:none;border:0;font-size:16px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}.modal.open{display:flex}.modal .box{background:#fff;padding:32px;border-radius:12px}footer{margin-top:900px;border-top:1px solid #ddd}</style></head>
<body>
<header><nav><a href="/">Orbit</a><button class="btn" id="connect">Connect wallet</button></nav></header>
<main>
  <h2>Swap</h2>
  <label>Amount <input id="amount" inputmode="decimal" placeholder="0.0"></label>
  <button class="btn" id="swap">Swap</button>
  <p id="status"></p>
</main>
<script>
  let account = null;
  document.getElementById('connect').addEventListener('click', async () => {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    account = accounts[0];
    document.getElementById('connect').textContent = account.slice(0, 6) + '…';
  });
  document.getElementById('swap').addEventListener('click', async () => {
    const status = document.getElementById('status');
    if (!account) { status.textContent = 'Connect a wallet first'; return; }
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] });
      await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: account, to: '0x2626664c2603336e57b271c5c0b26f421741e481', data: '0x04e45aaf', value: '0x0' }] });
      status.textContent = 'Submitted';
    } catch (e) {
      status.textContent = 'Transaction rejected (' + e.code + ')';
    }
  });
</script>
</body></html>
