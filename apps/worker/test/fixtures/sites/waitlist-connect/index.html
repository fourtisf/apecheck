<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Quill: on-chain AI</title><style>body{font-family:sans-serif;margin:0}header,main,footer{padding:24px}nav a{margin-right:16px}.btn{display:inline-block;padding:12px 20px;background:#222;color:#fff;border-radius:8px;text-decoration:none;border:0;font-size:16px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}.modal.open{display:flex}.modal .box{background:#fff;padding:32px;border-radius:12px}footer{margin-top:900px;border-top:1px solid #ddd}</style></head>
<body>
<header><nav><a href="/">Quill</a></nav></header>
<main>
  <h1>Your on-chain AI copilot</h1>
  <p>Live now on Base mainnet.</p>
  <button class="btn" id="connect">Connect wallet</button>
  <div id="joined" role="dialog" style="display:none"><h2>You're on the waitlist!</h2><p>We'll let you in when early access opens.</p></div>
</main>
<footer><p>© 2026 Quill.</p></footer>
<script>
  document.getElementById('connect').addEventListener('click', async () => {
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    document.getElementById('joined').style.display = 'block';
  });
</script>
</body></html>
